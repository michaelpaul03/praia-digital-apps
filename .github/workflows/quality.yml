name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Domain and storage regression tests
        run: node --test tests/*.test.mjs
      - name: Validate six entry points and package static production files
        run: python3 tools/build.py --output dist
